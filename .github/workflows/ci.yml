name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The publication gate audits commit messages over a range, so it
          # needs more than the shallow clone actions/checkout takes by default.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # Only the declared sets. Installing anything extra here would hide
        # exactly the fault this job exists to catch: code importing a package
        # nobody declared.
        run: pip install -e ".[dev,tts]"

      - name: Lint
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples

      - name: Type check
        # Not blocking yet, but the count is printed rather than swallowed:
        # continue-on-error alone marks the step green, which hides the very
        # number this is meant to expose. Blocking once it reaches zero.
        run: |
          mypy src tests scripts | tail -1 || true
          echo "type findings are not blocking yet; see PROJECT_RULES section 10"

      - name: Test
        run: pytest -q

      - name: Build the container
        # The image is what actually ships. A Dockerfile that no longer builds
        # would otherwise be discovered by whoever tries to deploy, which is
        # the worst moment to find out.
        run: docker build -t mindsurf-omni:ci .

      - name: Smoke the running service
        # Over a real socket rather than in process: serialisation, dropped
        # headers and missing WebSocket frames all pass an in-process test.
        run: |
          docker run -d --name omni -p 8000:8000 mindsurf-omni:ci
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8000/v1/models >/dev/null && break
            sleep 2
          done
          python scripts/smoke_service.py --base http://localhost:8000
          docker rm -f omni

      - name: Delivery check
        # Catches the gaps a unit test cannot see: a document promising an
        # endpoint nobody built, a licence conclusion the code contradicts.
        run: python scripts/verify_delivery.py

      - name: Publication gate
        # Reads the exit code directly. Piping it into anything would report
        # the pipeline's status instead, and a failing gate would pass.
        run: python scripts/release_gate.py --range origin/main...HEAD
