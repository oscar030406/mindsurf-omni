name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The publication gate audits commit messages over a range, so it
          # needs more than the shallow clone actions/checkout takes by default.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # Only the declared sets. Installing anything extra here would hide
        # exactly the fault this job exists to catch: code importing a package
        # nobody declared.
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Type check
        # Not blocking yet, but the count is printed rather than swallowed:
        # continue-on-error alone marks the step green, which hides the very
        # number this is meant to expose. Blocking once it reaches zero.
        run: |
          mypy src tests scripts | tail -1 || true
          echo "type findings are not blocking yet; see PROJECT_RULES section 10"

      - name: Test
        run: pytest -q

      - name: Publication gate
        # Reads the exit code directly. Piping it into anything would report
        # the pipeline's status instead, and a failing gate would pass.
        run: python scripts/release_gate.py --range origin/main...HEAD
