[project]
name = "mindsurf-omni"
version = "0.1.0"
description = "语音 AI 产品的算法侧：Thinker-Talker 原生音频 token 模型与 OpenAI 兼容推理服务"
requires-python = ">=3.11"
# What the service needs to answer a request. Kept minimal on purpose: this is
# what goes into the container, and every entry there is something to patch.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "mypy>=1.13",
    "httpx>=0.27",
    # The lazy parquet reader is tested without a GPU or a model, so its
    # dependency belongs here rather than in the runtime set -- the container
    # serves requests and never reads a training file.
    "pyarrow>=15",
    # The smoke test drives the running service over a real socket.
    "websockets>=12",
]
# Training and evaluation, which run on the host and never in the container.
# torch alone is ~2.5 GB; shipping it to every server that only answers HTTP
# would be a cost paid for nothing.
# transformers is pinned below 5 by MiniMind-O; the training host has its
# own environment, so this is the declared floor rather than a resolution.
train = ["torch>=2.6", "pyarrow>=15", "safetensors>=0.4", "transformers>=4.57"]
# zhconv folds traditional characters to simplified before CER. The judge
# picks a script per utterance, and without this the metric spends most of its
# range on that choice rather than on the speech -- see normalise_for_cer.
evaluate = ["openai-whisper>=20231117", "zhconv>=1.4"]
# The cascade path's recogniser. Separate from the runtime set because the
# native path does not need it, and funasr pulls in torch.
asr = ["funasr>=1.3", "librosa>=0.10"]
# The cascade path's hosted synthesiser. Its own set because it reaches a
# hosted endpoint: an image that carries it is an image that can be configured
# to send replies off the machine, so the choice is made when installing rather
# than inherited by every deployment.
tts = ["edge-tts>=7"]
# The local one, which is the same choice made the other way: no network, and
# 0.5B of weights plus torch on whatever card the model is already using. Kept
# separate from 'tts' for that reason -- a host that installs one has no use
# for the other.
tts-local = ["voxcpm>=2", "torch>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindsurf_omni"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "examples"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
