[project]
name = "mindsurf-omni"
version = "0.1.0"
description = "语音 AI 产品的算法侧：Thinker-Talker 原生音频 token 模型与 OpenAI 兼容推理服务"
requires-python = ">=3.11"
# What the service needs to answer a request. Kept minimal on purpose: this is
# what goes into the container, and every entry there is something to patch.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    # The polish stage holds deletions to word boundaries, which needs a
    # segmenter. Runtime rather than an extra: it is the stage the dictation
    # product is, and funasr already brings jieba along, so a host that can
    # transcribe already has it.
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = [
    # The metric tests exercise CER end to end, so the folding dependencies are
    # part of what it takes to run this suite. CI installs only the declared
    # sets on purpose -- a package the code imports and nobody declared is the
    # fault that job exists to catch, and for twelve days this was that fault.
    "mindsurf-omni[metrics]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "mypy>=1.13",
    "httpx>=0.27",
    # The lazy parquet reader is tested without a GPU or a model, so its
    # dependency belongs here rather than in the runtime set -- the container
    # serves requests and never reads a training file.
    "pyarrow>=15",
    # The smoke test drives the running service over a real socket.
    "websockets>=12",
]
# Training and evaluation, which run on the host and never in the container.
# torch alone is ~2.5 GB; shipping it to every server that only answers HTTP
# would be a cost paid for nothing.
# transformers is pinned below 5 by MiniMind-O; the training host has its
# own environment, so this is the declared floor rather than a resolution.
train = ["torch>=2.6", "pyarrow>=15", "safetensors>=0.4", "transformers>=4.57"]
# zhconv folds traditional characters to simplified before CER. The judge
# picks a script per utterance, and without this the metric spends most of its
# range on that choice rather than on the speech -- see normalise_for_cer.
# cn2an is the same correction one notation over: a synthesiser that reads
# 2021 as 二零二一 is right, and unfolded the metric charges it a substitution
# per digit. Opt-in (--fold-numerals), so it is a dependency of the flag.
evaluate = ["openai-whisper>=20231117", "mindsurf-omni[metrics]"]
# Script folding and numeral folding, which CER cannot be computed without.
# Split out of `evaluate` because that set also drags openai-whisper: CI runs
# the metric tests and has no business installing a 2 GB recogniser to do it.
# Both are small and pure Python, so the set is cheap to depend on.
metrics = ["zhconv>=1.4", "cn2an>=0.5"]
# The cascade path's recogniser. Separate from the runtime set because the
# native path does not need it, and funasr pulls in torch.
# pyyaml reads the checkpoint's own frontend settings, so that turning dither
# off does not also overwrite the framing the model was trained with. funasr
# already depends on it; declared here because this package imports it.
# torch and torchaudio are here because funasr imports both and declares
# neither (`importlib.metadata.requires("funasr")` lists 27 packages and no
# torch of any kind). Found by running the built image: the container came up,
# /health said the recogniser was ready, and the first dictation returned 500
# with ModuleNotFoundError: torchaudio out of funasr.utils.load_utils.
asr = ["funasr>=1.3", "librosa>=0.10", "pyyaml>=6.0", "torch>=2.6", "torchaudio>=2.6"]
# Everything the dictation product imports at inference: the recogniser, and
# the torch/transformers the polisher's MiniMind class needs. Its own set
# because it is the answer to one question -- "what do I install to run the
# product" -- which until now had no name and was spelled 'train', a set whose
# comment says it never runs in a container. The image built from the
# `dictation` stage carries exactly this.
dictation = ["mindsurf-omni[asr]", "torch>=2.6", "transformers>=4.57"]
# Word segmentation, used in one place: deciding where inside a clause a
# speaker could pause when building the polish training pairs. A filler dropped
# at a random character index splits a word (微波然后炉), which is a different
# noise from the one being modelled. Its own set because nothing in the service
# or the metrics touches it -- only the data builder.
polish-data = ["jieba>=0.42"]
# Column widths, a frozen header and a dropdown for the listening packs. Its
# own set because it exists only to make a spreadsheet fillable by a person --
# nothing in the service or the metrics touches it, and the packs still build
# without it (repack_listening falls back to the CSV alone and says so).
listening = ["openpyxl>=3.1"]
# The cascade path's hosted synthesiser. Its own set because it reaches a
# hosted endpoint: an image that carries it is an image that can be configured
# to send replies off the machine, so the choice is made when installing rather
# than inherited by every deployment.
tts = ["edge-tts>=7"]
# Voice-clone scoring: CAM++ from modelscope, mel front-end from torchaudio.
# Its own set because it is the only thing here that needs either, it runs on
# the training host rather than in the container, and the front-end has to
# match upstream's value for value -- see measure_voice_clone.py.
voice = ["modelscope>=1.18", "torchaudio>=2.6", "torch>=2.6", "transformers>=4.57"]
# The local one, which is the same choice made the other way: no network, and
# 0.5B of weights plus torch on whatever card the model is already using. Kept
# separate from 'tts' for that reason -- a host that installs one has no use
# for the other.
tts-local = ["voxcpm>=2", "torch>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindsurf_omni"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "examples"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
