services:
  omni:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Weights live outside the image; point this at the release directory.
      - ./release:/app/weights:ro
    environment:
      # native uses the Thinker-Talker path; cascade falls back to
      # ASR + text + TTS. Unset, the service answers 503 with a reason
      # rather than pretending to work.
      MINDSURF_ENGINE: "${MINDSURF_ENGINE:-}"
      MINDSURF_WEIGHTS: /app/weights
      # The dictation product: transcribe, then delete spoken filler. Unset,
      # the service transcribes and stops there. The polisher is built from
      # MiniMind's own model class, so a checkout has to be reachable too --
      # mount it and point MINIMIND_O_ROOT at the mount.
      MINDSURF_POLISH: "${MINDSURF_POLISH:-}"
      MINDSURF_POLISH_TAGGER: "${MINDSURF_POLISH_TAGGER:-}"
      MINDSURF_POLISH_TAGGER_BACKBONE: "${MINDSURF_POLISH_TAGGER_BACKBONE:-}"
      MINDSURF_POLISH_TAGGER_THRESHOLD: "${MINDSURF_POLISH_TAGGER_THRESHOLD:-0.4}"
      MINIMIND_O_ROOT: "${MINIMIND_O_ROOT:-}"
      # What this deployment is spoken in. Reaches the recogniser only for
      # audio too short for its own detector to be worth trusting.
      MINDSURF_ASR_LANGUAGE: "${MINDSURF_ASR_LANGUAGE:-zh}"
      # "sensevoice" or "paraformer-streaming". The streaming one writes while
      # the speaker is still talking, at a higher error rate, so it drives the
      # display and the final text still comes from the whole-buffer pass.
      MINDSURF_ASR_MODEL: "${MINDSURF_ASR_MODEL:-sensevoice}"
      # 朗读：客户端点小喇叭才念，不自动。空=关掉，唯一的值是 edge（托管，
      # 文本会离开本机）。默认关着，不想联网的部署不用特意去关。
      MINDSURF_TTS: "${MINDSURF_TTS:-}"
      # Seconds between preview readings while somebody is still talking.
      # 0 shows nothing until they release the key.
      MINDSURF_PREVIEW_SECONDS: "${MINDSURF_PREVIEW_SECONDS:-1.0}"
    restart: unless-stopped
